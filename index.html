<style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; margin: 0; }

    /* ══ NAVBAR ══ */
    #navbar {
        position: fixed; inset: 0 0 auto; z-index: 200;
        padding: 6px 16px;
        display: flex; align-items: center;
        transition: background .4s, box-shadow .4s;
    }
    #navbar.scrolled {
        background: rgba(255,255,255,.9);

        box-shadow: 0 4px 24px rgba(0,0,0,.08);

    }
    @media(min-width:768px){ #navbar { padding: 8px 52px; } }

    .logo-wrap { position:relative; height:60px; width:66px; flex-shrink:0; display:flex; align-items:center; }
    @media(min-width:768px){ .logo-wrap { height:108px; width:94px; } }

    /* MOBILE: logo maior */
    @media(max-width:767px){ .logo-wrap { height:78px; width:86px; } }

    #logo-w,#logo-b { position:absolute; height:115%; width:auto; transition:opacity .4s; }
    #logo-b { opacity:0; }
    #navbar.scrolled #logo-w { opacity:0; }
    #navbar.scrolled #logo-b  { opacity:1; }

    #nav-tag { position:relative; font-size:clamp(8px,2.2vw,16px); font-weight:700; font-style:italic; white-space:nowrap; flex-shrink:0; margin-left:-4px; display:inline-block; }
    #nav-tag .tw { color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.45); transition:opacity .4s; opacity:1; display:block; }
    #nav-tag .tc { position:absolute; top:0; left:0; white-space:nowrap; transition:opacity .4s; opacity:0; display:block; }
    #nav-tag .tc .nd { color:#001A4F; }
    #nav-tag .tc .ng { color:#009C3B; }
    #navbar.scrolled #nav-tag .tw { opacity:0; }
    #navbar.scrolled #nav-tag .tc { opacity:1; }

    /* MOBILE: frase maior */
    @media(max-width:767px){ #nav-tag { font-size: clamp(11px, 3.8vw, 15px); } }

    #wpp-btn { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.55); border-radius:999px; padding:7px 16px; text-decoration:none; backdrop-filter:blur(6px); transition:background .35s, border-color .35s; margin-left:auto; flex-shrink:0; }
    #wpp-btn svg { width:22px; height:22px; }
    #wpp-btn span { color:#fff; font-size:clamp(10px,1.8vw,13px); font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,.3); transition:color .35s, text-shadow .35s; }
    #navbar.scrolled #wpp-btn { background:rgba(0,156,59,.1); border-color:#009C3B; }
    #navbar.scrolled #wpp-btn span { color:#001A4F; font-weight:800; text-shadow:none; }

    /* MOBILE: botão WhatsApp maior */
    @media(max-width:767px){
        #wpp-btn { padding: 9px 14px; gap: 7px; }
        #wpp-btn svg { width: 24px; height: 24px; }
        #wpp-btn span { font-size: 12px; }
    }

    /* ══ HERO ══ */
    .hero {
        position: relative;
        width: 100%;
        height: 85vh;
        min-height: 620px;
        overflow: hidden;
        background: #000;
    }
    @media(min-width:1024px){ .hero { height: 80vh; min-height: 640px; } }

    /* MOBILE: hero menor */
    @media(max-width:767px){ .hero { height: 68vh; min-height: 520px; } }

    .slide { position:absolute; inset:0; opacity:0; transition:opacity 2s ease-in-out; z-index:1; }
    .slide.active { opacity:1; z-index:2; }
    .slide-bg { position:absolute; inset:0; background-size:cover; background-position:center top; }
    @media(max-width:767px){ .slide-bg { background-position:center center; } }

    /* ══ OVERLAY ══ */

        position: absolute; inset: 0; z-index: 10;
        background: linear-gradient(to top,
            rgba(0,10,30,.88) 0%,
            rgba(0,10,30,.35) 52%,
            rgba(0,10,30,.08) 100%);

        flex-direction: column;
        justify-content: center;
        padding: 80px 8px 20px;

    @media(min-width:768px){ .hero-overlay { padding: 100px 24px 28px; } }

    /* MOBILE: overlay empurra conteúdo para baixo */
    @media(max-width:767px){
        .hero-overlay {
            justify-content: flex-end;
            padding: 80px 12px 16px;
        }
    }

    .hero-text-block { padding-bottom: 22px; width: 100%; }
    @media(min-width:768px){ .hero-text-block { padding-bottom: 28px; } }

    /* MOBILE: título centralizado */
    @media(max-width:767px){
        .hero-text-block {
            display: flex;
            justify-content: center;
            padding-bottom: 14px;
        }
    }

    .hero-title {
        font-weight: 900; font-style: italic; text-transform: uppercase; color: #fff;
        line-height: 1.12; margin: 0 0 10px;
        font-size: clamp(20px, 1.8vw, 42px);
        white-space: nowrap;
        text-shadow: 0 2px 18px rgba(0,0,0,.45), 0 0 32px rgba(255,204,0,.15);
        animation: swell 3.5s ease-in-out infinite;
    }

    /* MOBILE: título centralizado e quebra linha */
    @media(max-width:767px){
        .hero-title {
            text-align: center;
            white-space: normal;
            font-size: clamp(18px, 5.5vw, 26px);
        }
    }

    @keyframes swell {
        0%,100%{ transform:scale(1); }
        50%{ transform:scale(1.022); text-shadow:0 0 24px rgba(255,255,255,.35),0 0 40px rgba(255,204,0,.28); }

    /* ══ FORMULÁRIO ══ */
    #search-section {
        position: relative;
        z-index: 20;
        padding: 0;
        background: transparent;
        width: 100%;
    }

    .search-wrap {
        width: 100%;
        border-radius: 18px;
        overflow: visible;
        background: rgba(0, 8, 24, 0.42);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,.14);
        box-shadow: 0 8px 40px rgba(0,0,0,.35);
    }

    /* MOBILE: fundo mais sólido */
    @media(max-width:767px){
        .search-wrap { background: rgba(0,0,0,.72); border-color: rgba(255,255,255,.10); }
    }

    .type-bar {
        background: rgba(0,156,59,.40);
        backdrop-filter: blur(8px);
        padding: 10px 16px;
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        border-bottom: 1px solid rgba(255,255,255,.10);
        border-radius: 18px 18px 0 0;
    }
    .type-bar-label { color:rgba(255,255,255,.72); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.14em; margin-right:4px; }
    .type-pill { padding:5px 18px; border-radius:999px; border:2px solid rgba(255,255,255,.5); background:transparent; color:rgba(255,255,255,.85); font-size:11px; font-weight:800; font-family:inherit; cursor:pointer; transition:all .2s; text-transform:uppercase; letter-spacing:.05em; }
    .type-pill.active { background:#fff; border-color:#fff; color:#009C3B; }
    .type-pill:not(.active):hover { background:rgba(255,255,255,.18); }

    /* MOBILE: pills centralizados, label oculto, pill ativo verde */
    @media(max-width:767px){
        .type-bar { justify-content: center; padding: 10px 12px; gap: 8px; }
        .type-bar-label { display: none; }
        .type-pill { flex: 1; text-align: center; padding: 8px 10px; font-size: 12px; }
        .type-pill.active { background: #009C3B; border-color: #009C3B; color: #fff; }
    }

    .search-body { padding: 18px 18px 20px; background: transparent; }

    /* MOBILE: padding menor */
    @media(max-width:767px){ .search-body { padding: 12px 12px 14px; } }

    .search-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        align-items: end;
    }
    .search-grid .search-submit { grid-column: 1 / -1; }

    @media(min-width:768px){
        .search-grid {
            grid-template-columns: repeat(6, minmax(0,1fr)) auto;
            gap: 12px;
        }
        .search-grid .search-submit { grid-column: auto; }
        .search-body { padding: 22px 26px 26px; }
        .sf-input, .drop-btn { font-size: 13px; padding: 13px 14px; }
        .search-submit { height:54px; font-size:15px; box-shadow:0 8px 32px rgba(0,156,59,.5); }
    }

    /* MOBILE: grid em coluna com rows agrupadas */
    @media(max-width:767px){
        .search-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        /* Row 1: Origem + Destino lado a lado */
        .sf-row-1 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        /* Row 2: Ida + Volta + Passageiros + Bagagem em 4 colunas */
        .sf-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
        }
    }

    /* Desktop: rows se comportam normalmente */
    @media(min-width:768px){
        .sf-row-1 { display: contents; }
        .sf-row-2 { display: contents; }
        .search-submit-wrap { display: contents; }
    }

    .sf { display:flex; flex-direction:column; gap:6px; }
    .sf-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,.55); }

    /* MOBILE: label e input menores */
    @media(max-width:767px){
        .sf-label { font-size: 9px; }
    }

    .sf-input {
        width:100%;
        background: rgba(255,255,255,.12);
        border: 1.5px solid rgba(255,255,255,.20);
        border-radius:12px; padding:14px 14px; font-size:14px; font-weight:700;
        font-family:inherit; color:#fff; outline:none;
        transition:border-color .2s, background .2s;
        -webkit-appearance:none; appearance:none; box-sizing:border-box; min-width:0;
    }
    .sf-input::placeholder { color:rgba(255,255,255,.40); font-weight:600; }
    .sf-input:focus { border-color:#009C3B; background:rgba(255,255,255,.18); box-shadow:0 0 0 3px rgba(0,156,59,.25); }
    input[type="date"].sf-input { color:#fff; color-scheme:dark; }
    input[type="date"].sf-input:not(:valid) { color:rgba(255,255,255,.38); }
    input[type="date"].sf-input::-webkit-calendar-picker-indicator { filter:invert(1) opacity(.55); cursor:pointer; }

    /* MOBILE: inputs menores */
    @media(max-width:767px){
        .sf-input { font-size: 12px; padding: 10px 8px; border-radius: 10px; }
    }

    .drop-wrap { position:relative; }
    .drop-btn {
        width:100%;
        background: rgba(255,255,255,.12);
        border: 1.5px solid rgba(255,255,255,.20);
        border-radius:12px; padding:14px 14px; font-size:14px; font-weight:700;
        font-family:inherit; color:#fff; cursor:pointer;
        display:flex; justify-content:space-between; align-items:center;
        transition:border-color .2s, background .2s;
        box-sizing:border-box; gap:6px; min-width:0; overflow:visible;
    }
    .drop-btn:hover,.drop-btn.open { border-color:#009C3B; background:rgba(255,255,255,.20); }
    .drop-btn .lbl { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; text-align:left; }
    .drop-btn .arr { font-size:9px; color:rgba(255,255,255,.45); flex-shrink:0; transition:transform .2s; }
    .drop-btn.open .arr { transform:rotate(180deg); }

    /* MOBILE: drop-btn menor */
    @media(max-width:767px){
        .drop-btn { font-size: 12px; padding: 10px 8px; border-radius: 10px; }
    }

    .drop-menu {
        display:none; position:absolute; bottom:calc(100% + 8px);
        width:244px; background:#001A4F;
        border:1px solid rgba(255,255,255,.2);
        border-radius:18px; padding:16px;
        z-index:9999; box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
    .drop-menu.open { display:block; }
    #dm-pass { left:0; right:auto; }
    #dm-bag  { right:0; left:auto; }

    .drop-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid rgba(255,255,255,.08); }
    .drop-row:first-child { border-top:none; padding-top:0; }
    .drop-rt { font-size:10px; font-weight:800; text-transform:uppercase; color:#fff; }
    .drop-rs { font-size:9px; color:rgba(255,255,255,.42); margin-top:2px; }
    .cnt-wrap { display:flex; align-items:center; gap:10px; }
    .cnt-btn { width:32px; height:32px; min-width:32px; border-radius:50%; border:1.5px solid rgba(255,255,255,.35); background:transparent; color:#fff; font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; touch-action:manipulation; line-height:1; }
    .cnt-btn:hover  { background:rgba(255,255,255,.2); }
    .cnt-btn:active { background:rgba(255,255,255,.35); transform:scale(.9); }
    .cnt-val { color:#fff; font-weight:900; font-size:14px; min-width:22px; text-align:center; }
    .drop-ok { width:100%; background:#009C3B; color:#fff; padding:9px; border-radius:10px; font-size:10px; font-weight:800; text-transform:uppercase; border:none; cursor:pointer; margin-top:12px; font-family:inherit; transition:background .2s; }
    .drop-ok:hover { background:#007a2e; }

    .search-submit {
        background: linear-gradient(135deg, #009C3B 0%, #00c44a 100%);
        color: #fff; border: none; border-radius: 14px;
        font-size: 15px; font-weight: 900; text-transform: uppercase; font-style: italic;
        letter-spacing: .04em; font-family: inherit;
        cursor: pointer; transition: all .2s;
        box-shadow: 0 6px 22px rgba(0,156,59,.42);
        height: 52px; width: 100%;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        white-space: nowrap;
    }
    .search-submit:hover { background:linear-gradient(135deg,#007a2e,#009C3B); transform:translateY(-2px); box-shadow:0 10px 32px rgba(0,156,59,.52); }

    /* MOBILE: botão submit */
    @media(max-width:767px){
        .search-submit {
            height: 52px;
            font-size: 14px;
            border-radius: 12px;
            font-style: normal;
            letter-spacing: .06em;
            box-shadow: 0 6px 24px rgba(0,156,59,.5);
        }
        .search-submit-wrap { width: 100%; }
    }

    /* ══ DEPOIMENTOS ══ */
    .testi-section { padding: 96px 24px; background: linear-gradient(160deg,#f0fdf4 0%,#e0f2fe 50%,#f0fdf4 100%); border-top: 1px solid #e2e8f0; overflow: hidden; }
    .testi-head { text-align: center; margin-bottom: 64px; }
    .testi-head .eyebrow { color:#009C3B; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.14em; margin-bottom:12px; }
    .testi-head h2 { font-size:clamp(26px,5vw,44px); font-weight:900; font-style:italic; text-transform:uppercase; color:#001A4F; margin:0 0 12px; }
    .testi-head h2 span { color:#009C3B; }
    .testi-head p { color:#64748b; font-size:clamp(13px,1.8vw,16px); font-weight:500; max-width:480px; margin:0 auto; }
    .swiper-testi { width: 100%; padding-bottom: 72px !important; }
    .testi-card { background: #fff; border-radius: 24px; padding: 40px 32px 36px; box-shadow: 0 8px 40px rgba(0,0,0,.10); display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; overflow: hidden; height: 100%; transition: transform .3s, box-shadow .3s; user-select: none; }
    .testi-card:hover { transform: translateY(-6px); box-shadow: 0 18px 56px rgba(0,26,79,.14); }
    .testi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg,#009C3B,#FFCC00); }
    .testi-avatar { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 18px; flex-shrink: 0; box-shadow: 0 4px 18px rgba(0,0,0,.18); border: 3px solid #fff; outline: 2px solid rgba(0,156,59,.28); }
    .testi-stars { display:flex; gap:3px; justify-content:center; margin-bottom:16px; }
    .star { color:#FFCC00; font-size:16px; }
    .testi-quote { font-size:44px; color:#009C3B; line-height:1; margin-bottom:14px; }
    .testi-text { color: #475569; font-size: clamp(13px,1.6vw,15px); line-height: 1.85; margin-bottom: 28px; font-style: italic; font-weight: 500; flex: 1; }
    .testi-name { font-weight:900; color:#001A4F; font-size:14px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
    .testi-role { color:#009C3B; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .swiper-testi .swiper-pagination-bullet { width: 10px; height: 10px; background: rgba(0,156,59,.25); opacity: 1; transition: all .3s; }
    .swiper-testi .swiper-pagination-bullet-active { background: #009C3B; transform: scale(1.4); box-shadow: 0 0 0 4px rgba(0,156,59,.15); }
    .swiper-testi .swiper-button-prev, .swiper-testi .swiper-button-next { width: 48px; height: 48px; background: #fff; border-radius: 50%; border: 2px solid #009C3B; box-shadow: 0 4px 16px rgba(0,156,59,.2); color: #009C3B; transition: all .25s; top: 50%; transform: translateY(calc(-50% - 36px)); }
    .swiper-testi .swiper-button-prev:hover, .swiper-testi .swiper-button-next:hover { background: #009C3B; color: #fff; box-shadow: 0 6px 24px rgba(0,156,59,.38); }
    .swiper-testi .swiper-button-prev::after, .swiper-testi .swiper-button-next::after { font-size: 14px; font-weight: 900; }
    .swiper-testi .swiper-pagination-progressbar { height: 3px; background: rgba(0,156,59,.15); }
    .swiper-testi .swiper-pagination-progressbar .swiper-pagination-progressbar-fill { background: #009C3B; }

    /* ══ ESCALA MOBILE via JS ══ */
    #agent-widget { position: fixed; bottom: 24px; right: 24px; z-index: 99999; }

    /* ══ CHAT ══ */
    .pulse-g { animation: pg 2s infinite; }
    @keyframes pg { 0%{ box-shadow:0 0 0 0 rgba(0,156,59,.7); } 70%{ box-shadow:0 0 0 16px rgba(0,156,59,0); } 100%{ box-shadow:0 0 0 0 rgba(0,156,59,0); } }
    #chat-w { max-height:85vh; display:flex; flex-direction:column; }
    #chat-m b { color:#009c3b; font-weight:800; }
    .noscroll::-webkit-scrollbar { display:none; }
    .suc-card { background:#fff; border-radius:24px; border:1px solid #f1f5f9; box-shadow:0 4px 20px rgba(0,0,0,.08); padding:24px; transition:transform .3s; display:flex; flex-direction:column; }
    .suc-card:hover { transform:translateY(-8px); }
    .step-c { background:#fff; border-radius:16px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,.08); border:1px solid #f1f5f9; display:flex; flex-direction:column; align-items:center; text-align:center; transition:all .3s; }
    .step-c:hover { transform:translateY(-8px); box-shadow:0 8px 40px rgba(0,0,0,.15); }
</style>

<body>

<!-- ════════ NAVBAR ════════ -->
<header id="navbar">
  <div style="max-width:1280px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;">
    <div style="display:flex;align-items:center;flex-shrink:0;min-width:0;gap:0;">
      <div class="logo-wrap">
        <img id="logo-w" src="img/logo.png" alt="Voe F5 Tour">
        <img id="logo-b" src="img/logg.png" alt="Voe F5 Tour">
      </div>
      <span id="nav-tag">
        <em class="tw">Atualize a sua forma de <span style="color:#FFCC00;">viajar</span></em>
        <em class="tc"><span class="nd">Atualize a sua forma de </span><span class="ng">viajar</span></em>
      </span>
